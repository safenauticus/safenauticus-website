<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>SafeNauticus Services Inc.</title>
  <meta
    name="description"
    content="SafeNauticus Services Inc. - Marine Assurance, Technical and Consultancy Services."
  />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: #ffffff;
      text-align: center;

      background:
        linear-gradient(
          rgba(3, 17, 30, 0.70),
          rgba(3, 17, 30, 0.86)
        ),
        url("Cover.jpeg") 42% center / cover no-repeat fixed;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow-x: hidden;
    }

    .overlay {
      width: 100%;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 45px 24px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: auto;
    }

    .logo {
      width: 190px;
      max-width: 60%;
      height: auto;

      display: block;
      margin: 0 auto 30px;
    }

    h1 {
      font-size: clamp(34px, 4.5vw, 52px);
      font-weight: 700;
      letter-spacing: 3px;
      margin-bottom: 14px;
    }

    .subtitle {
      font-size: clamp(15px, 1.8vw, 19px);
      font-weight: 400;
      letter-spacing: 0.6px;
      line-height: 1.6;

      opacity: 0.95;
      margin-bottom: 34px;
    }

    .divider {
      width: 58px;
      height: 2px;

      background: rgba(255, 255, 255, 0.72);

      margin: 0 auto 32px;
    }

    h2 {
      font-size: clamp(26px, 3.2vw, 36px);
      font-weight: 500;
      letter-spacing: 0.2px;

      margin-bottom: 16px;
    }

    .message {
      font-size: clamp(15px, 1.6vw, 17px);
      line-height: 1.75;

      opacity: 0.88;
      margin-bottom: 34px;
    }

    .services {
      font-size: clamp(12px, 1.2vw, 14px);
      font-weight: 500;

      letter-spacing: 1px;
      line-height: 1.9;

      text-transform: uppercase;

      opacity: 0.82;
      margin-bottom: 28px;
    }

    .email {
      display: inline-block;

      font-size: 16px;
      font-weight: 500;

      color: #ffffff;
      text-decoration: none;

      opacity: 0.92;

      transition:
        opacity 0.2s ease,
        transform 0.2s ease;
    }

    .email:hover {
      opacity: 1;
      transform: translateY(-1px);
    }

    @media (max-width: 768px) {
      body {
        background-attachment: scroll;
        background-position: 42% center;
      }

      .overlay {
        padding: 34px 20px;
      }

      .logo {
        width: 165px;
        margin-bottom: 25px;
      }

      h1 {
        letter-spacing: 2.3px;
      }

      .subtitle {
        margin-bottom: 28px;
      }

      .divider {
        margin-bottom: 28px;
      }

      .services {
        max-width: 600px;
        margin-left: auto;
        margin-right: auto;
      }
    }

    @media (max-width: 480px) {
      .logo {
        width: 145px;
      }

      h1 {
        letter-spacing: 1.8px;
      }

      .services {
        letter-spacing: 0.7px;
      }

      .message br {
        display: none;
      }
    }
  </style>
</head>

<body>

  <div class="overlay">
    <div class="container">

      <img
        src="Linkedin logo.jpeg"
        alt="SafeNauticus Services Inc."
        class="logo"
      />

      <h1>SAFENAUTICUS</h1>

      <div class="subtitle">
        Marine Assurance, Technical &amp; Consultancy Services
      </div>

      <div class="divider"></div>

      <h2>Launching Soon</h2>

      <div class="message">
        Our new website is currently being prepared.<br>
        We look forward to connecting with you soon.
      </div>

      <div class="services">
        Marine Auditing • Survey • Advisory • Operational &amp; Technical Support
      </div>

      <a
        class="email"
        href="mailto:info@safenauticus.com"
      >
        info@safenauticus.com
      </a>

    </div>
  </div>

</body>
</html>
