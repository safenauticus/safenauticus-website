<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SafeNauticus Services Inc.</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        linear-gradient(rgba(5, 20, 34, 0.80), rgba(5, 20, 34, 0.90)),
        url("cover.jpg") center/cover no-repeat;
      font-family: Arial, Helvetica, sans-serif;
      color: white;
      text-align: center;
      padding: 30px;
    }

    .container {
      max-width: 850px;
      width: 100%;
    }

    .logo {
      max-width: 260px;
      width: 70%;
      height: auto;
      margin-bottom: 35px;
    }

    h1 {
      font-size: 42px;
      letter-spacing: 2px;
      margin-bottom: 15px;
    }

    .subtitle {
      font-size: 18px;
      letter-spacing: 1px;
      opacity: 0.9;
      margin-bottom: 45px;
    }

    .divider {
      width: 70px;
      height: 2px;
      background: #ffffff;
      margin: 0 auto 35px;
      opacity: 0.65;
    }

    h2 {
      font-size: 28px;
      font-weight: 500;
      margin-bottom: 15px;
    }

    .message {
      font-size: 17px;
      line-height: 1.7;
      opacity: 0.85;
      margin-bottom: 40px;
    }

    .services {
      font-size: 14px;
      letter-spacing: 1.2px;
      opacity: 0.75;
      margin-bottom: 25px;
    }

    .email {
      font-size: 16px;
      color: white;
      text-decoration: none;
    }

    .email:hover {
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 30px;
      }

      h2 {
        font-size: 23px;
      }

      .subtitle {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <img src="logo.png" alt="SafeNauticus Logo" class="logo">

    <h1>SAFENAUTICUS</h1>

    <div class="subtitle">
      Marine Technical, Operational & Consultancy Services
    </div>

    <div class="divider"></div>

    <h2>Website Under Development</h2>

    <div class="message">
      Our new website is currently in progress.<br>
      We will be online soon.
    </div>

    <div class="services">
      MARINE AUDITING &nbsp;•&nbsp; SURVEY &nbsp;•&nbsp; ADVISORY &nbsp;•&nbsp; OPERATIONAL SUPPORT
    </div>

    <a class="email" href="mailto:info@safenauticus.com">
      info@safenauticus.com
    </a>

  </div>
</body>
</html>
