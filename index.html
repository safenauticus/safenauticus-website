<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>SafeNauticus Services Inc.</title>

  <meta
    name="description"
    content="SafeNauticus Services Inc. - Marine Assurance, Technical and Consultancy Services."
  />

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #071a2b;
      font-family: Arial, Helvetica, sans-serif;
      color: #ffffff;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
    }

    .hero {
      width: 100%;
      min-height: 100vh;

      background-color: #071a2b;

      background-image:
        linear-gradient(
          rgba(3, 17, 30, 0.12),
          rgba(3, 17, 30, 0.18)
        ),
        url("Cover.jpeg");

      background-size: 100% auto;
      background-position: top center;
      background-repeat: no-repeat;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 250px 24px 60px;
    }

    .content {
      width: 100%;
      max-width: 900px;
      text-align: center;
      margin: 0 auto;
    }

    .logo {
      width: 340px;
      max-width: 85%;
      height: auto;
      display: block;
      margin: 0 auto 24px;
    }

    .subtitle {
      font-size: clamp(16px, 1.9vw, 20px);
      font-weight: 400;
      letter-spacing: 0.6px;
      line-height: 1.6;
      opacity: 0.95;
      margin-bottom: 30px;
    }

    .divider {
      width: 58px;
      height: 2px;
      background: rgba(255, 255, 255, 0.70);
      margin: 0 auto 28px;
    }

    h2 {
      font-size: clamp(28px, 3vw, 38px);
      font-weight: 500;
      margin-bottom: 14px;
    }

    .message {
      font-size: clamp(15px, 1.5vw, 17px);
      line-height: 1.75;
      opacity: 0.88;
      margin-bottom: 30px;
    }

    .services {
      font-size: clamp(12px, 1.1vw, 14px);
      font-weight: 500;
      letter-spacing: 1px;
      line-height: 1.9;
      text-transform: uppercase;
      opacity: 0.82;
      margin-bottom: 26px;
    }

    .contact {
      margin-top: 4px;
      line-height: 1.9;
    }

    .email,
    .phone {
      display: inline-block;
      font-size: 16px;
      font-weight: 500;
      color: #ffffff;
      text-decoration: none;
      opacity: 0.92;
    }

    .email:hover,
    .phone:hover {
      opacity: 1;
    }

    .person {
      margin-top: 16px;
      font-size: 15px;
      line-height: 1.6;
      opacity: 0.88;
    }

    .person-name {
      font-weight: 600;
      font-size: 16px;
    }

    .person-title {
      font-size: 14px;
      opacity: 0.78;
    }

    @media (max-width: 1100px) {
      .hero {
        padding-top: 220px;
      }
    }

    @media (max-width: 768px) {
      .hero {
        background-size: 100% auto;
        background-position: top center;
        padding: 170px 20px 45px;
      }

      .logo {
        width: 290px;
        max-width: 88%;
        margin-bottom: 22px;
      }

      .subtitle {
        margin-bottom: 26px;
      }

      .services {
        max-width: 600px;
        margin-left: auto;
        margin-right: auto;
        margin-bottom: 24px;
      }
    }

    @media (max-width: 480px) {
      .hero {
        padding-top: 120px;
      }

      .logo {
        width: 250px;
        max-width: 90%;
      }

      .services {
        letter-spacing: 0.7px;
      }

      .message br {
        display: none;
      }
    }
  </style>
</head>

<body>

  <section class="hero">

    <div class="content">

      <img
        src="mainlogo.jpeg"
        alt="SafeNauticus Services Inc."
        class="logo"
      />

      <div class="subtitle">
        Marine Assurance, Technical &amp; Consultancy Services
      </div>

      <div class="divider"></div>

      <h2>Launching Soon</h2>

      <div class="message">
        Our new website is currently being prepared.<br>
        We look forward to connecting with you soon.
      </div>

      <div class="services">
        Marine Auditing • Survey • Advisory • Operational &amp; Technical Support
      </div>

      <div class="contact">

        <a
          href="mailto:info@safenauticus.com"
          class="email"
        >
          info@safenauticus.com
        </a>

        <br>

        <a
          href="tel:+905419722993"
          class="phone"
        >
          +90 541 972 29 93
        </a>

        <div class="person">
          <div class="person-name">Ahmet Boz</div>
          <div class="person-title">Managing Director</div>
        </div>

      </div>

    </div>

  </section>

</body>
</html>
