<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SafeNauticus Services Inc.</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: #ffffff;
      background:
        linear-gradient(
          rgba(3, 17, 30, 0.68),
          rgba(3, 17, 30, 0.84)
        ),
        url("Cover.jpeg") center center / cover no-repeat fixed;

      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow-x: hidden;
    }

    .overlay {
      width: 100%;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 50px 24px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: auto;
    }

    .logo {
      width: 220px;
      max-width: 65%;
      height: auto;
      display: block;
      margin: 0 auto 32px;
    }

    h1 {
      font-size: clamp(36px, 5vw, 58px);
      font-weight: 700;
      letter-spacing: 4px;
      margin-bottom: 14px;
    }

    .subtitle {
      font-size: clamp(15px, 2vw, 20px);
      font-weight: 400;
      letter-spacing: 0.8px;
      line-height: 1.6;
      margin-bottom: 38px;
      opacity: 0.95;
    }

    .divider {
      width: 64px;
      height: 2px;
      background: rgba(255,255,255,0.8);
      margin: 0 auto 34px;
    }

    h2 {
      font-size: clamp(26px, 3.5vw, 38px);
      font-weight: 500;
      margin-bottom: 16px;
    }

    .message {
      font-size: clamp(15px, 1.7vw, 18px);
      line-height: 1.8;
      opacity: 0.9;
      margin-bottom: 34px;
    }

    .services {
      font-size: clamp(12px, 1.3vw, 15px);
      letter-spacing: 1.4px;
      line-height: 1.9;
      opacity: 0.84;
      margin-bottom: 26px;
      text-transform: uppercase;
    }

    .email {
      display: inline-block;
      font-size: 17px;
      color: #ffffff;
      text-decoration: none;
      font-weight: 500;
      padding-bottom: 3px;
      border-bottom: 1px solid rgba(255,255,255,0.45);
    }

    .email:hover {
      border-bottom-color: #ffffff;
    }

    @media (max-width: 768px) {
      body {
        background-attachment: scroll;
        background-position: center center;
      }

      .overlay {
        padding: 36px 20px;
      }

      .logo {
        width: 180px;
        margin-bottom: 26px;
      }

      h1 {
        letter-spacing: 2.5px;
      }

      .subtitle {
        margin-bottom: 30px;
      }

      .services {
        line-height: 2;
      }
    }

    @media (max-width: 480px) {
      .logo {
        width: 160px;
      }

      .services {
        letter-spacing: 0.8px;
      }
    }
  </style>
</head>

<body>
  <div class="overlay">
    <div class="container">

      <img
        src="Linkedin logo.jpeg"
        alt="SafeNauticus Services Inc. Logo"
        class="logo"
      >

      <h1>SAFENAUTICUS</h1>

      <div class="subtitle">
        Marine Assurance, Technical & Consultancy Services
      </div>

      <div class="divider"></div>

      <h2>Launching Soon</h2>

      <div class="message">
        Our new website is taking shape.<br>
        We look forward to welcoming you soon.
      </div>

      <div class="services">
        Marine Auditing • Survey • Advisory • Operational & Technical Support
      </div>

      <a
        class="email"
        href="mailto:info@safenauticus.com"
      >
        info@safenauticus.com
      </a>

    </div>
  </div>
</body>
</html>
